services:
  # Dịch vụ 1: trang web chính (FastAPI)
  - type: web
    name: do-an-python-web
    runtime: python
    plan: free
    rootDir: web
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8

  # Dịch vụ 2: các widget ipywidgets chạy bằng Voilà
  - type: web
    name: do-an-python-widgets
    runtime: python
    plan: free
    rootDir: widgets
    buildCommand: pip install -r requirements.txt
    startCommand: voila . --no-browser --Voila.ip=0.0.0.0 --port=$PORT
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
